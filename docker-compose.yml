services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub_secret
      POSTGRES_DB: aihub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aihub:aihub_secret@postgres:5432/aihub?sslmode=disable
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      ENVIRONMENT: development
      JWT_SECRET: dev-jwt-secret-change-in-production
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_IMAGE: aihub-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
